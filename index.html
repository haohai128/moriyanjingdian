<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#112630">
  <title>末日眼镜店 · 第一副备用镜</title>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0c1922; color: #e0e6d9; font-family: "Microsoft YaHei", system-ui, sans-serif; }
    #canvas { position: fixed; inset: 0; display: block; width: 100% !important; height: 100% !important; outline: none; touch-action: none; }
    body { overscroll-behavior: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0c1922; z-index: 2; padding: 24px; }
    .card { width: min(560px, 100%); padding: 40px; border: 1px solid #71866c; border-radius: 12px; background: #152e36; }
    .eyebrow { color: #e7c28b; font-size: 12px; letter-spacing: .15em; }
    h1 { font-weight: 500; font-size: clamp(32px, 5vw, 46px); margin: 16px 0; }
    p { color: #afc2b5; line-height: 1.8; }
    progress { width: 100%; height: 7px; margin: 18px 0; accent-color: #e7c28b; }
    button { cursor: pointer; color: #e7c28b; border: 1px solid #778b72; background: #263f42; padding: 12px 20px; border-radius: 6px; font: inherit; }
    button:hover { background: #3c534b; }
    button:disabled { opacity: .65; cursor: wait; }
    #start { width: 100%; }
    #notice { white-space: pre-wrap; color: #e7c28b; font-size: 14px; }
    #load-detail { min-height: 1.8em; margin-top: -8px; }
    .tools { position: fixed; right: 12px; bottom: 12px; z-index: 1; display: flex; gap: 6px; opacity: .65; }
    .tools:hover { opacity: 1; }
    .tools button, .tools a { font-size: 11px; padding: 5px 9px; background: #112630; color: #afc2b5; text-decoration: none; border: 1px solid #37534f; border-radius: 4px; }
    .note { font-size: 12px; }
    #webgl-error { display: none; }
    dialog { width: min(800px, 92vw); max-height: 85vh; color: #e0e6d9; background: #152e36; border: 1px solid #778b72; border-radius: 10px; padding: 24px; }
    dialog::backdrop { background: #061017dd; }
    dialog pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.7 monospace; }
    dialog .close-row { position: sticky; top: -24px; background: #152e36; padding: 12px 0; }
    .touch-device #canvas { -webkit-touch-callout: none; user-select: none; }
    .touch-device.playing .tools { display: none; }
    @media (max-width: 600px), (max-height: 600px) {
      #loading { overflow-y: auto; padding: 16px; }
      .card { padding: 24px; margin: auto; }
      h1 { margin: 12px 0; }
      progress { margin: 10px 0; }
      #start { min-height: 48px; }
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="末日眼镜店游戏画面">浏览器需要支持 Canvas。</canvas>
  <div id="loading">
    <main class="card">
      <div class="eyebrow">LAST LIGHT OPTICS · 浏览器试玩版</div>
      <h1>末日眼镜店</h1>
      <p>替看不清路的人，留一盏灯。<br>第一章 · 第一副备用镜</p>
      <progress id="progress" value="0" max="1"></progress>
      <p id="notice" role="status">正在准备游戏…</p>
      <p id="load-detail" class="note">首次打开需要下载游戏，再次打开通常更快。</p>
      <button id="start">开始试玩</button>
      <p class="note"><span id="controls-help">电脑操作：A / D 移动，E 互动，Tab 背包。手机支持触屏，横竖屏均可游玩。</span><br><span id="storage-note">允许网站存储时，进度保存在当前浏览器。</span></p>
    </main>
  </div>
  <nav class="tools" aria-label="网页操作">
    <button id="fullscreen" type="button">全屏</button>
    <button id="licenses" type="button">开源许可</button>
  </nav>
  <dialog id="license-dialog" aria-label="开源许可">
    <div class="close-row"><button id="close-licenses" type="button">关闭许可，返回游戏</button></div>
    <pre id="license-text">正在读取包内许可文件…</pre>
  </dialog>
  <noscript>请启用 JavaScript 后运行游戏。</noscript>
  <script src="index.js"></script>
  <script>
    const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":299728,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    // Request the updated content even when a visitor still has an earlier
    // demo cached. Keep the virtual pack filename unchanged inside Godot.
    const packPath = config.mainPack || `${config.executable}.pck`;
    const packUrl = `${packPath}?v=demo-0.3-mobile`;
    config.fileSizes[packUrl] = config.fileSizes[packPath];
    if (navigator.maxTouchPoints > 0) {
      document.body.classList.add('touch-device');
      document.getElementById('controls-help').textContent = '触屏操作：按住左移 / 右移，靠近标记后点互动；快走可同时按住。维修时用手指点选、擦拭。横竖屏自动适应。';
    }
    // Opaque-origin sandboxes can forbid IndexedDB. Keep the game playable
    // using session memory without asking for storage or parent-window access.
    let persistentStorage = true;
    try { persistentStorage = globalThis.origin !== 'null' && !!globalThis.indexedDB; }
    catch { persistentStorage = false; }
    if (!persistentStorage) {
      config.persistentPaths = [];
      document.getElementById('storage-note').textContent = '当前隔离窗口仅保留本次进度，刷新后重新开始。';
    }
    const start = document.getElementById('start');
    const notice = document.getElementById('notice');
    const detail = document.getElementById('load-detail');
    const progress = document.getElementById('progress');
    const canvas = document.getElementById('canvas');
    let launching = false;
    let prepared = false;
    let failed = false;
    let preparation;
    let elapsedTimer;
    const preparationStarted = performance.now();
    const stopTimer = () => clearInterval(elapsedTimer);
    function showFailure(error) {
      failed = true;
      stopTimer();
      console.error(error);
      notice.textContent = '启动未完成：' + String(error.message || error);
      detail.textContent = '请刷新页面重试；若持续失败，请尝试其他网络或浏览器。';
      start.textContent = '刷新重试';
      start.disabled = false;
    }
    config.onProgress = (current, total) => {
      if (prepared || failed) return;
      if (total > 0 && current >= total) {
        // Download completion is not engine readiness. Compilation and startup
        // still take time, especially on slower devices.
        progress.removeAttribute('value');
        notice.textContent = '下载已完成，正在准备游戏…';
      } else if (total > 0) {
        progress.max = total;
        progress.value = current;
        notice.textContent = '正在下载游戏 ' + Math.floor(current / total * 100) + '%';
      } else {
        progress.removeAttribute('value');
      }
    };
    const engine = new Engine(config);
    const missing = Engine.getMissingFeatures({threads: false});
    if (location.protocol === 'file:') {
      notice.textContent = '请通过网站链接打开游戏，不能直接双击 HTML 文件。';
      detail.textContent = '';
      start.disabled = true;
    } else if (missing.length) {
      notice.textContent = '当前浏览器缺少游戏所需功能：' + missing.join('、') + '\n请尝试新版 Chrome、Edge 或 Firefox，并启用图形加速。';
      detail.textContent = '';
      start.disabled = true;
    } else {
      // Prepare while the visitor reads the intro. These same promises/files
      // are consumed by start(), so clicking does not download them again.
      elapsedTimer = setInterval(() => {
        const seconds = Math.floor((performance.now() - preparationStarted) / 1000);
        detail.textContent = `已等待 ${seconds} 秒。` + (seconds >= 15
          ? '首次打开可能较慢，请保持页面打开；若长时间无进展，可尝试其他网络。'
          : '首次打开需要下载游戏，再次打开通常更快。');
      }, 1000);
      preparation = Promise.all([
        engine.init(config.executable),
        engine.preloadFile(packUrl, packPath),
      ]).then(() => {
        prepared = true;
        if (!launching) {
          stopTimer();
          progress.max = 1;
          progress.value = 1;
          notice.textContent = '游戏已准备好，点击开始试玩。';
          detail.textContent = '准备完成。';
        }
        return true;
      }).catch(error => {
        showFailure(error);
        return false;
      });
    }
    start.addEventListener('click', async () => {
      if (failed) { location.reload(); return; }
      if (launching) return;
      launching = true;
      start.disabled = true;
      start.textContent = '正在准备…';
      try {
        if (!await preparation) return;
        stopTimer();
        notice.textContent = '正在进入游戏…';
        detail.textContent = '资源准备完成，正在打开游戏画面。';
        progress.removeAttribute('value');
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        await engine.start({ canvas, args: ['--main-pack', packPath].concat(config.args || []) });
        document.body.classList.add('playing');
        document.getElementById('loading').remove();
        canvas.focus();
      } catch (error) {
        showFailure(error);
      }
    });
    document.getElementById('fullscreen').addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
        canvas.focus();
      } catch (error) { console.warn(error); }
    });
    const licenseDialog = document.getElementById('license-dialog');
    document.getElementById('licenses').addEventListener('click', async () => {
      licenseDialog.showModal();
      try {
        const response = await fetch('licenses.html');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const documentText = new DOMParser().parseFromString(await response.text(), 'text/html');
        document.getElementById('license-text').textContent = documentText.querySelector('pre').textContent;
      } catch {
        document.getElementById('license-text').textContent = '许可文件未能读取，请联系发布者检查包内 licenses.html。';
      }
    });
    document.getElementById('close-licenses').addEventListener('click', () => { licenseDialog.close(); canvas.focus(); });
    // Tab belongs to the inventory while the canvas is focused.
    canvas.addEventListener('keydown', event => { if (event.key === 'Tab') event.preventDefault(); });
  </script>
</body>
</html>
